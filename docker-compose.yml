version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gramsetu_postgres
    environment:
      POSTGRES_DB: gramsetu_db
      POSTGRES_USER: gramsetu_user
      POSTGRES_PASSWORD: gramsetu_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gramsetu_user -d gramsetu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gramsetu_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: gramsetu_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-gramsetu-v2-prod-key-12345
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DATABASE_URL=postgres://gramsetu_user:gramsetu_pass@db:5432/gramsetu_db
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: .
    container_name: gramsetu_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - SECRET_KEY=django-insecure-gramsetu-v2-prod-key-12345
      - DEBUG=False
      - DATABASE_URL=postgres://gramsetu_user:gramsetu_pass@db:5432/gramsetu_db
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - web
      - redis

volumes:
  postgres_data:
  media_volume:
  static_volume:
